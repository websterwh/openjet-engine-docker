name: Check Upstream Updates

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      openjet_commit: ${{ steps.compare.outputs.openjet_commit }}
      llama_ref: ${{ steps.compare.outputs.llama_ref }}
      llama_edge: ${{ steps.compare.outputs.llama_edge }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Query upstream references and compare versions
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Query latest upstream commit touching megakernel/ via GitHub API
          LATEST_OPENJET=$(gh api "repos/L-Forster/open-jet/commits?path=megakernel&per_page=1" --jq '.[0].sha')
          if [ -z "$LATEST_OPENJET" ]; then
            echo "ERROR: Failed to resolve latest upstream OpenJet commit." >&2
            exit 1
          fi

          # 2. Extract LLAMA_CPP_MTP_REF from src/provisioning.py at that exact upstream commit
          PINNED_LLAMA=$(gh api "repos/L-Forster/open-jet/contents/src/provisioning.py?ref=${LATEST_OPENJET}" --jq '.content' | base64 -d | grep -E "LLAMA_CPP_MTP_REF\s*=" | head -n1 | sed -E 's/.*LLAMA_CPP_MTP_REF\s*=\s*["'"'"']([^"'"'"']+)["'"'"'].*/\1/' || echo "")
          if [ -z "$PINNED_LLAMA" ]; then
            echo "Warning: LLAMA_CPP_MTP_REF not found in src/provisioning.py, falling back to b10246"
            PINNED_LLAMA="b10246"
          fi

          # 3. Query latest ggml-org/llama.cpp release tag via GitHub API (for edge build)
          LATEST_EDGE=$(gh api "repos/ggml-org/llama.cpp/releases?per_page=1" --jq '.[0].tag_name')
          if [ -z "$LATEST_EDGE" ]; then
            echo "ERROR: Failed to resolve latest llama.cpp release tag." >&2
            exit 1
          fi

          echo "Resolved upstream references:"
          echo "  OpenJet Commit:         $LATEST_OPENJET"
          echo "  Pinned LLAMA_CPP_MTP:   $PINNED_LLAMA"
          echo "  Latest llama.cpp Edge:  $LATEST_EDGE"

          # 4. Read current versions from docker/versions.json and evaluate changes in Python
          python3 -c '
          import json, os, datetime

          versions_file = "docker/versions.json"
          if os.path.exists(versions_file):
              with open(versions_file) as f:
                  data = json.load(f)
          else:
              data = {}

          curr_openjet = data.get("openjet_commit", "").strip()
          curr_llama_pinned = data.get("llama_cpp_ref", "").strip()
          curr_llama_edge = data.get("llama_cpp_edge", "").strip()
          curr_edge_updated = data.get("llama_cpp_edge_updated_at", "").strip()

          latest_openjet = "'"$LATEST_OPENJET"'".strip()
          pinned_llama = "'"$PINNED_LLAMA"'".strip()
          latest_edge = "'"$LATEST_EDGE"'".strip()

          now = datetime.datetime.now(datetime.timezone.utc)
          openjet_changed = (curr_openjet != latest_openjet)
          pinned_llama_changed = (curr_llama_pinned != pinned_llama)
          edge_different = (curr_llama_edge != latest_edge)

          # Calculate days since last edge llama.cpp update
          if curr_edge_updated:
              try:
                  dt = datetime.datetime.fromisoformat(curr_edge_updated.replace("Z", "+00:00"))
                  days = (now - dt).total_seconds() / 86400.0
              except Exception:
                  days = 999.0
          else:
              days = 999.0

          # Rule: Bump llama.cpp edge at most once per 7 days unless OpenJet SHA changed
          allow_edge_bump = openjet_changed or (days >= 7.0)
          edge_changed = edge_different and allow_edge_bump

          should_update = openjet_changed or pinned_llama_changed or edge_changed
          final_edge = latest_edge if edge_changed else curr_llama_edge
          final_edge_updated = now.isoformat() if edge_changed else curr_edge_updated

          print(f"Current: openjet={curr_openjet}, pinned_llama={curr_llama_pinned}, edge={curr_llama_edge}, edge_updated={curr_edge_updated}")
          print(f"Latest:  openjet={latest_openjet}, pinned_llama={pinned_llama}, edge={latest_edge}")
          print(f"Days since edge update: {days:.2f}. Allow edge bump: {allow_edge_bump}")
          print(f"Result:  openjet_changed={openjet_changed}, pinned_changed={pinned_llama_changed}, edge_changed={edge_changed}, should_update={should_update}")

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"changed={'true' if should_update else 'false'}\n")
                  f.write(f"openjet_commit={latest_openjet}\n")
                  f.write(f"llama_ref={pinned_llama}\n")
                  f.write(f"llama_edge={final_edge}\n")
                  f.write(f"edge_updated_at={final_edge_updated}\n")
          '

      - name: Update versions.json and push commit
        if: steps.compare.outputs.changed == 'true'
        env:
          NEW_OPENJET: ${{ steps.compare.outputs.openjet_commit }}
          NEW_LLAMA_PINNED: ${{ steps.compare.outputs.llama_ref }}
          NEW_LLAMA_EDGE: ${{ steps.compare.outputs.llama_edge }}
          NEW_EDGE_UPDATED: ${{ steps.compare.outputs.edge_updated_at }}
        run: |
          echo "Writing updated docker/versions.json..."
          python3 -c '
          import json
          with open("docker/versions.json", "w") as f:
              json.dump({
                  "openjet_commit": "'"$NEW_OPENJET"'",
                  "llama_cpp_ref": "'"$NEW_LLAMA_PINNED"'",
                  "llama_cpp_edge": "'"$NEW_LLAMA_EDGE"'",
                  "llama_cpp_edge_updated_at": "'"$NEW_EDGE_UPDATED"'"
              }, f, indent=2)
              f.write("\n")
          '

          git add docker/versions.json
          COMMIT_MSG="chore(versions): update openjet to ${NEW_OPENJET:0:7}, llama.cpp pinned to ${NEW_LLAMA_PINNED}, edge to ${NEW_LLAMA_EDGE}"
          git commit -m "$COMMIT_MSG"
          git push origin master
          echo "Pushed updated versions.json to origin/master."

      - name: Monthly Keepalive Commit
        if: steps.compare.outputs.changed == 'false'
        run: |
          # Ensure GitHub does not disable scheduled workflows after 60 days of inactivity
          LAST_COMMIT_TS=$(git log -1 --format=%ct)
          NOW_TS=$(date +%s)
          DAYS_SINCE=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))
          DAY_OF_MONTH=$(date +%d)

          if [ "$DAYS_SINCE" -ge 30 ] || [ "$DAY_OF_MONTH" = "01" ]; then
            echo "Performing monthly keepalive commit (days since last commit: $DAYS_SINCE)..."
            git commit --allow-empty -m "chore(keepalive): monthly workflow keepalive commit [skip ci]"
            git push origin master
            echo "Keepalive commit pushed."
          else
            echo "Repository has recent commits ($DAYS_SINCE days ago). No keepalive commit needed."
          fi

  trigger-build-job:
    needs: check-and-update
    if: needs.check-and-update.outputs.changed == 'true'
    permissions:
      contents: write
      packages: write
      issues: write
    uses: ./.github/workflows/build.yml
    with:
      openjet_ref: ${{ needs.check-and-update.outputs.openjet_commit }}
      llama_cpp_ref: ${{ needs.check-and-update.outputs.llama_ref }}
      llama_cpp_edge: ${{ needs.check-and-update.outputs.llama_edge }}
