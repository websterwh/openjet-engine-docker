name: Build and Push Megakernel Container

on:
  workflow_dispatch:
    inputs:
      openjet_ref:
        description: 'OpenJet commit SHA or ref (leave blank to read from docker/versions.json)'
        required: false
        default: ''
      llama_cpp_ref:
        description: 'llama.cpp pinned release tag or ref (leave blank to read from docker/versions.json)'
        required: false
        default: ''
      llama_cpp_edge:
        description: 'llama.cpp edge release tag or ref (leave blank to read from docker/versions.json)'
        required: false
        default: ''
  workflow_call:
    inputs:
      openjet_ref:
        type: string
        required: false
        default: ''
      llama_cpp_ref:
        type: string
        required: false
        default: ''
      llama_cpp_edge:
        type: string
        required: false
        default: ''
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'SOURCE.md'
      - 'docker-compose.example.yml'

permissions:
  contents: write
  packages: write
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-entrypoint:
    name: Test Entrypoint (ShellCheck & Stubs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run shellcheck on entrypoint scripts
        run: |
          shellcheck docker/entrypoint.sh docker/test_entrypoint.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Entrypoint Test Suite in Built Image
        run: |
          IMAGE="ghcr.io/websterwh/openjet-engine:latest"
          if ! docker pull "$IMAGE"; then
            echo "Warning: $IMAGE not yet published, falling back to base nvidia cuda runtime"
            IMAGE="nvidia/cuda:12.9.2-runtime-ubuntu24.04"
            docker pull "$IMAGE"
          fi

          docker run --rm \
            -v "$GITHUB_WORKSPACE/docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro" \
            -v "$GITHUB_WORKSPACE/docker/entrypoint.sh:/entrypoint.sh:ro" \
            -v "$GITHUB_WORKSPACE/docker/test_entrypoint.sh:/test_entrypoint.sh:ro" \
            --entrypoint bash \
            "$IMAGE" /test_entrypoint.sh

  build-and-test:
    needs: test-entrypoint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Build References and Tags
        id: vars
        run: |
          # 1. Resolve openjet commit
          INPUT_OPENJET="${{ inputs.openjet_ref }}"
          if [ -n "$INPUT_OPENJET" ]; then
            OPENJET_COMMIT="$INPUT_OPENJET"
          else
            OPENJET_COMMIT=$(python3 -c "import json; print(json.load(open('docker/versions.json')).get('openjet_commit', '').strip())" 2>/dev/null || echo "${{ github.sha }}")
          fi
          if [ -z "$OPENJET_COMMIT" ]; then
            OPENJET_COMMIT="${{ github.sha }}"
          fi
          OPENJET_SHA7=$(echo "$OPENJET_COMMIT" | cut -c1-7)

          # 2. Resolve pinned llama.cpp ref
          INPUT_LLAMA="${{ inputs.llama_cpp_ref }}"
          if [ -n "$INPUT_LLAMA" ]; then
            LLAMA_REF="$INPUT_LLAMA"
          else
            LLAMA_REF=$(python3 -c "import json; print(json.load(open('docker/versions.json')).get('llama_cpp_ref', '').strip())" 2>/dev/null || echo "b10246")
          fi
          if [ -z "$LLAMA_REF" ]; then
            LLAMA_REF="b10246"
          fi

          # 3. Resolve edge llama.cpp ref
          INPUT_EDGE="${{ inputs.llama_cpp_edge }}"
          if [ -n "$INPUT_EDGE" ]; then
            LLAMA_EDGE="$INPUT_EDGE"
          else
            LLAMA_EDGE=$(python3 -c "import json; print(json.load(open('docker/versions.json')).get('llama_cpp_edge', '').strip())" 2>/dev/null || echo "")
          fi
          # 4. Resolve repository commit SHA (7 chars)
          REPO_SHA7=$(git rev-parse --short=7 HEAD 2>/dev/null || echo "${{ github.sha }}" | cut -c1-7)

          IMAGE_REPO="ghcr.io/websterwh/openjet-engine"
          VERSION_TAG="${IMAGE_REPO}:sha-${OPENJET_SHA7}-${LLAMA_REF}-${REPO_SHA7}"
          LATEST_TAG="${IMAGE_REPO}:latest"
          PREVIOUS_TAG="${IMAGE_REPO}:previous"
          EDGE_TAG="${IMAGE_REPO}:edge"
          EDGE_VERSION_TAG="${IMAGE_REPO}:sha-${OPENJET_SHA7}-${LLAMA_EDGE}-${REPO_SHA7}"
          echo "openjet_commit=$OPENJET_COMMIT" >> $GITHUB_OUTPUT
          echo "openjet_sha7=$OPENJET_SHA7" >> $GITHUB_OUTPUT
          echo "llama_ref=$LLAMA_REF" >> $GITHUB_OUTPUT
          echo "llama_edge=$LLAMA_EDGE" >> $GITHUB_OUTPUT
          echo "image_repo=$IMAGE_REPO" >> $GITHUB_OUTPUT
          echo "repo_sha7=$REPO_SHA7" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "edge_tag=$EDGE_TAG" >> $GITHUB_OUTPUT
          echo "edge_version_tag=$EDGE_VERSION_TAG" >> $GITHUB_OUTPUT
          echo "Resolved build references:"
          echo "  OpenJet Commit:    $OPENJET_COMMIT ($OPENJET_SHA7)"
          echo "  Pinned llama.cpp:  $LLAMA_REF"
          echo "  Edge llama.cpp:    $LLAMA_EDGE"
          echo "  Stable Tag:        $VERSION_TAG"
          echo "  Latest Tag:        $LATEST_TAG"
          echo "  Previous Tag:      $PREVIOUS_TAG"
          echo "  Edge Tag:          $EDGE_TAG"

      - name: Fetch megakernel from upstream open-jet (sparse checkout)
        uses: actions/checkout@v4
        with:
          repository: L-Forster/open-jet
          ref: ${{ steps.vars.outputs.openjet_commit }}
          sparse-checkout: megakernel
          sparse-checkout-cone-mode: false
          path: upstream-checkout

      - name: Prepare Docker Build Context
        run: |
          echo "Placing megakernel/ into build context..."
          cp -r upstream-checkout/megakernel ./megakernel
          rm -rf upstream-checkout

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================================
      # Part 1: Stable Build (Pinned LLAMA_CPP_REF) -> latest, previous, sha-...
      # ========================================================================
      - name: Build Pinned Stable Image (linux/amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            OPENJET_COMMIT=${{ steps.vars.outputs.openjet_commit }}
            LLAMA_CPP_REF=${{ steps.vars.outputs.llama_ref }}
          load: true
          tags: ${{ steps.vars.outputs.version_tag }}
          cache-from: type=gha,scope=pinned
          cache-to: type=gha,mode=max,scope=pinned

      - name: Run CPU Smoke Tests on Pinned Image
        env:
          VERSION_TAG: ${{ steps.vars.outputs.version_tag }}
        run: |
          echo "Running smoke verification on locally built image: $VERSION_TAG"
          echo "=========================================================="
          echo " Smoke Test 1: openjet-engine --help"
          echo "=========================================================="
          docker run --rm --entrypoint openjet-engine "$VERSION_TAG" --help

          echo "=========================================================="
          echo " Smoke Test 2: Verify ldd dynamic link resolution"
          echo "=========================================================="
          docker run --rm --entrypoint bash "$VERSION_TAG" -c '
            set -euo pipefail
            for arch in sm86 sm89 sm120; do
              lib="/opt/open-jet/libs/libqwen38mk_${arch}.so"
              echo "Checking $lib..."
              if [ ! -f "$lib" ]; then
                echo "ERROR: Missing $lib" >&2
                exit 1
              fi
              if ldd "$lib" | grep "not found"; then
                echo "ERROR: Unresolved dynamic link dependencies in $lib" >&2
                exit 1
              fi
            done
            echo "SUCCESS: All megakernel libraries resolved dynamic links cleanly."
          '

          echo "=========================================================="
          echo " Smoke Test 3: Verify llama.cpp library loads and server module imports"
          echo "=========================================================="
          docker run --rm --entrypoint python3 "$VERSION_TAG" -c '
          import ctypes, os
          import megakernel.server.mk_server as srv

          llama_path = "/opt/open-jet/llama.cpp/build/bin/libllama.so"
          if not os.path.exists(llama_path):
              raise FileNotFoundError(f"Missing {llama_path}")

          lib = ctypes.CDLL(llama_path)
          assert lib is not None, "Failed to load libllama.so"
          assert hasattr(srv, "main"), "mk_server missing main()"
          assert hasattr(srv, "Server"), "mk_server missing Server class"
          print("SUCCESS: libllama.so loaded and megakernel.server.mk_server imported successfully.")
          '

          echo "=========================================================="
          echo " Smoke Test 4: Verify entrypoint stubs and flags execution"
          echo "=========================================================="
          docker run --rm \
            -v "$GITHUB_WORKSPACE/docker/test_entrypoint.sh:/test_entrypoint.sh:ro" \
            --entrypoint bash \
            "$VERSION_TAG" /test_entrypoint.sh
      - name: Retag previous and promote latest Tag (from Pinned Build only)
        env:
          IMAGE_REPO: ${{ steps.vars.outputs.image_repo }}
          VERSION_TAG: ${{ steps.vars.outputs.version_tag }}
          LATEST_TAG: ${{ steps.vars.outputs.latest_tag }}
          PREVIOUS_TAG: ${{ steps.vars.outputs.previous_tag }}
        run: |
          echo "Checking if immutable tag $VERSION_TAG already exists in registry..."
          if docker buildx imagetools inspect "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Immutable tag $VERSION_TAG already exists in registry. Skipping push to avoid overwriting."
          else
            echo "Pushing immutable tag $VERSION_TAG..."
            docker push "$VERSION_TAG"
            echo "Successfully pushed $VERSION_TAG."
          fi

          echo "Pinned smoke tests passed. Retagging current latest as previous..."
          if docker pull "$LATEST_TAG"; then
            echo "Retagging current latest to $PREVIOUS_TAG..."
            docker tag "$LATEST_TAG" "$PREVIOUS_TAG"
            docker push "$PREVIOUS_TAG"
            echo "Successfully updated $PREVIOUS_TAG."
          else
            echo "No existing latest tag found to retag."
          fi

          echo "Promoting pinned version: Tagging $VERSION_TAG as $LATEST_TAG..."
          docker tag "$VERSION_TAG" "$LATEST_TAG"
          docker push "$LATEST_TAG"
          echo "Successfully promoted and pushed $LATEST_TAG."
      # ========================================================================
      # Part 2: Edge Build (Newest llama.cpp Release) -> edge, sha-<openjet7>-<edge>
      # ========================================================================
      - name: Build, Test and Promote Edge Image
        if: steps.vars.outputs.llama_edge != '' && steps.vars.outputs.llama_edge != steps.vars.outputs.llama_ref
        env:
          EDGE_VERSION_TAG: ${{ steps.vars.outputs.edge_version_tag }}
          EDGE_TAG: ${{ steps.vars.outputs.edge_tag }}
          LLAMA_EDGE: ${{ steps.vars.outputs.llama_edge }}
          OPENJET_COMMIT: ${{ steps.vars.outputs.openjet_commit }}
        run: |
          echo "Building edge image with llama.cpp ref: $LLAMA_EDGE..."
          docker buildx build \
            --platform linux/amd64 \
            --build-arg OPENJET_COMMIT="$OPENJET_COMMIT" \
            --build-arg LLAMA_CPP_REF="$LLAMA_EDGE" \
            --file docker/Dockerfile \
            --tag "$EDGE_VERSION_TAG" \
            --tag "$EDGE_TAG" \
            --load \
            .

          echo "Running smoke tests on Edge image..."
          docker run --rm --entrypoint openjet-engine "$EDGE_TAG" --help
          docker run --rm --entrypoint bash "$EDGE_TAG" -c '
            set -euo pipefail
            for arch in sm86 sm89 sm120; do
              lib="/opt/open-jet/libs/libqwen38mk_${arch}.so"
              if [ ! -f "$lib" ] || ldd "$lib" | grep "not found"; then
                echo "ERROR: Unresolved dependencies in edge $lib" >&2
                exit 1
              fi
            done
          '
          docker run --rm --entrypoint python3 "$EDGE_TAG" -c '
          import ctypes, megakernel.server.mk_server as srv
          lib = ctypes.CDLL("/opt/open-jet/llama.cpp/build/bin/libllama.so")
          assert lib is not None and hasattr(srv, "main")
          print("SUCCESS: Edge smoke tests passed.")
          '

          echo "Checking if immutable edge tag $EDGE_VERSION_TAG already exists in registry..."
          if docker buildx imagetools inspect "$EDGE_VERSION_TAG" >/dev/null 2>&1; then
            echo "Immutable edge tag $EDGE_VERSION_TAG already exists in registry. Skipping push to avoid overwriting."
          else
            echo "Pushing immutable edge tag $EDGE_VERSION_TAG..."
            docker push "$EDGE_VERSION_TAG"
            echo "Successfully pushed $EDGE_VERSION_TAG."
          fi

          echo "Promoting edge tag $EDGE_TAG..."
          docker push "$EDGE_TAG"
          echo "SUCCESS: Edge build verified and pushed ($EDGE_TAG)."
      - name: Job Summary on Success
        run: |
          echo "## :white_check_mark: Build and CPU Smoke Tests Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ steps.vars.outputs.image_repo }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stable Tag (Pinned)** | \`${{ steps.vars.outputs.version_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Latest Tag** | \`${{ steps.vars.outputs.latest_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Previous Tag** | \`${{ steps.vars.outputs.previous_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Edge Tag** | \`${{ steps.vars.outputs.edge_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **OpenJet Commit** | \`${{ steps.vars.outputs.openjet_commit }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pinned llama.cpp** | \`${{ steps.vars.outputs.llama_ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Edge llama.cpp** | \`${{ steps.vars.outputs.llama_edge }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Smoke Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "- :heavy_check_mark: \`openjet-engine --help\` ran successfully" >> $GITHUB_STEP_SUMMARY
          echo "- :heavy_check_mark: \`ldd\` confirmed all dynamic link dependencies resolve for \`sm_86\`, \`sm_89\`, and \`sm_120\`" >> $GITHUB_STEP_SUMMARY
          echo "- :heavy_check_mark: \`libllama.so\` loaded into Python via \`ctypes\`" >> $GITHUB_STEP_SUMMARY
          echo "- :heavy_check_mark: \`megakernel.server.mk_server\` imported successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** CI tests are CPU-only smoke tests that cross-compile without a physical GPU. Real GPU inference verification is performed on hardware with an NVIDIA GeForce RTX 3090." >> $GITHUB_STEP_SUMMARY

      # Failure handling: open or update GitHub issue, and do NOT move latest
      - name: Report Build or Test Failure via GitHub Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENJET_COMMIT: ${{ steps.vars.outputs.openjet_commit }}
          LLAMA_REF: ${{ steps.vars.outputs.llama_ref }}
          VERSION_TAG: ${{ steps.vars.outputs.version_tag }}
        run: |
          echo "Build or smoke tests failed! Checking for existing failure issue..."
          ISSUE_TITLE="Automated build failure for openjet-engine"
          EXISTING_ISSUE=$(gh issue list --search "$ISSUE_TITLE in:title" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          ISSUE_BODY="Build or smoke test failure occurred on workflow run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          - **OpenJet Commit:** \`${OPENJET_COMMIT}\`
          - **llama.cpp Ref:** \`${LLAMA_REF}\`
          - **Target Version Tag:** \`${VERSION_TAG}\`

          The \`latest\` tag was not updated."

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Updating existing issue #$EXISTING_ISSUE..."
            gh issue comment "$EXISTING_ISSUE" --body "$ISSUE_BODY"
          else
            echo "Creating new issue..."
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body "$ISSUE_BODY" \
              --label "bug" || true
          fi
